<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クイズ早押し</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/game.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>クイズ早押し</h1>
    <div class="identity">
      <label for="username">現在の操作ユーザー</label>
      <input id="username" type="text" maxlength="20" value="プレイヤー1">
      <span class="hint">※試作品では名前を切り替えて複数人の動作を試せます</span>
    </div>
    <details class="settings">
      <summary>設定</summary>
      <div class="settings-panel">
        <label>早押し音
          <select data-sound-select="buzzer"></select>
        </label>
        <label>出題音
          <select data-sound-select="question"></select>
        </label>
        <label>正解音
          <select data-sound-select="correct"></select>
        </label>
        <label>不正解音
          <select data-sound-select="incorrect"></select>
        </label>
        <button id="reset-all" class="danger-button" type="button">ゲーム全体を初期化</button>
        <p class="hint">初期化すると得点・履歴・出題状態が消えます。名前と音の選択は維持します。</p>
      </div>
    </details>
  </header>

  <main>
    <section class="game-area" aria-label="早押しエリア">
      <p id="game-status" class="status" role="status">出題可能です。出題ボタンを押してください。</p>
      <p id="host-label" class="host-label">出題者：未設定</p>
      <button id="buzzer-button" class="buzzer" type="button" disabled>
        <span>早押し</span>
        <small>ANSWER</small>
      </button>
      <p id="buzzer-message" class="buzzer-message">出題開始後に回答できます</p>
    </section>

    <section class="lower-layout">
      <section class="panel history-panel">
        <h2>回答履歴</h2>
        <ol id="history-list" class="history-list">
          <li class="empty-state">まだ回答はありません</li>
        </ol>
      </section>

      <section class="panel score-panel">
        <h2>得点ランキング</h2>
        <ol id="score-list" class="score-list">
          <li class="empty-state">得点はまだありません</li>
        </ol>
      </section>
    </section>

    <section class="host-controls" aria-label="出題者用操作">
      <button id="question-button" class="control-button question-button" type="button">出題</button>
      <button id="correct-button" class="control-button correct-button" type="button" disabled>正解</button>
      <button id="incorrect-button" class="control-button incorrect-button" type="button" disabled>不正解</button>
      <button id="reset-question-button" class="control-button reset-button" type="button" disabled>問題リセット</button>
    </section>
    <p class="footer-note">
      試作品：このブラウザ内だけで動作します。複数端末間の同期はまだ実装していません。
    </p>
  </main>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <p>ゲーム全体を初期化します。得点・履歴・出題状態がすべて消えます。</p>
      <div class="dialog-actions">
        <button value="cancel" class="control-button">キャンセル</button>
        <button id="confirm-reset" value="confirm" class="control-button danger-button">初期化する</button>
      </div>
    </form>
  </dialog>
</body>
</html>
